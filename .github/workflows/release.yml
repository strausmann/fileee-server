name: release
on:
  schedule:
    - cron: "0 5 * * *"   # taeglich 05:00 UTC — 1h nach go-fileee (Lib zuerst). NIE on push (User-Vorgabe).
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - id: semrel
        run: |
          npx semantic-release
          echo "version=$(git tag --points-at HEAD | grep '^v' | sed 's/^v//' | head -1)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Docker-Hub-Secrets aus Infisical holen
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: fileee-server-ci
          env-slug: prod
          secret-path: /
          domain: https://secretsmanager.strausmann.cloud
      - uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Image-Tags berechnen (semver-kaskade major/minor/patch + latest)
        id: tags
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          major=${V%%.*}
          minor=${V%.*}
          {
            echo 'list<<TAGS'
            for img in ghcr.io/strausmann/fileee-server strausmann/fileee-server; do
              echo "$img:$V"
              echo "$img:$minor"
              echo "$img:$major"
              echo "$img:latest"
            done
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
