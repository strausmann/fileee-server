# Template — muss auf dem Ziel-Node nach /etc/crowdsec/acquis.d/ kopiert werden,
# siehe README-Abschnitt "CrowdSec-Anbindung aktivieren". Im Repo allein ist es wirkungslos.
#
# follow_stderr MUSS false bleiben: stdout trägt den Access-Log im NGINX-combined-Format,
# stderr das JSON-App-/Audit-Log. Ohne diese Zeile (Default true) landet das JSON im
# nginx-Parser und erzeugt nur Parse-Fehler.
source: docker
container_name:
  - fileee-server            # muss zum container_name der genutzten compose.*.yaml passen
follow_stdout: true
follow_stderr: false
labels:
  type: nginx                # routet an crowdsecurity/nginx (http-bruteforce/http-probing)
