name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      # golangci-lint als Go-Linter-Standard (statt MegaLinter) — siehe .golangci.yml und
      # .claude/skills/repo-bootstrap/SKILL.md im homelab-management-Repo.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go build ./...
      - run: go vet ./...
      # -race braucht cgo (Race-Detector-Runtime); der Server-Build selbst bleibt pure-Go
      # (go build/vet oben laufen mit CGO_ENABLED=0). Nur diese Stufe aktiviert cgo.
      - name: Test (race + coverage)
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -coverprofile=cover.out
      - name: Coverage-Gate (test-coverage-pflicht.md)
        run: |
          chmod +x scripts/coverage-gate-strict.sh
          # Schwellen sind an die tatsächlich gemessene Coverage angelehnt (Stand 2026-07-25,
          # `go test ./... -race -coverprofile=cover.out` gegen HEAD von main, gefolgt von
          # `go tool cover -func=cover.out` gruppiert per Datei), NICHT an aspirationale
          # Zielwerte — ein Gate, das ab Tag 1 rot ist, verliert seine Wirkung (siehe
          # homelab-management test-coverage-pflicht.md "GOLDENE REGEL"). Jede Schwelle liegt
          # mit Sicherheitsabstand (Floor, nicht Ziel) unter dem gemessenen Wert:
          #   auth.go 100.0→90, config.go 100.0→90, secrets.go 100.0→90, server.go 100.0→90,
          #   handlers_destructive.go 100.0→90, accesslog.go 96.1→85, watch.go 97.4→85,
          #   handlers_conversations.go 94.6→80, handlers_share.go 89.2→75, resolve.go 88.9→75,
          #   version.go 100.0→90, banner.go 100.0→90, selfcheck.go 100.0→90 (die drei neuen
          #   Boot-Diagnostics-Dateien, Issue #17/Enhancement-Bündel "Boot-Diagnostics +
          #   Versionsbanner + OCI-Labels")
          #   Nachgezogen, nachdem die zuvor untesteten Handler eigene Tests bekommen haben —
          #   ausserhalb von main.go (main/fatal/execFileeeServer/runInfisicalCommand/
          #   infisicalVersionCommand kapseln os.Exit, syscall.Exec und exec.Command und sind
          #   deshalb bewusst ungetestet) gibt es damit keine 0%-Funktion mehr:
          #   handlers_documents.go 90.5→80, handlers_entities.go 98.0→90, errors.go 100.0→90.
          ./scripts/coverage-gate-strict.sh cover.out \
            cmd/fileee-server/auth.go:90 \
            cmd/fileee-server/config.go:90 \
            cmd/fileee-server/secrets.go:90 \
            cmd/fileee-server/server.go:90 \
            cmd/fileee-server/handlers_destructive.go:90 \
            cmd/fileee-server/accesslog.go:85 \
            cmd/fileee-server/watch.go:85 \
            cmd/fileee-server/handlers_conversations.go:80 \
            cmd/fileee-server/handlers_share.go:75 \
            cmd/fileee-server/resolve.go:75 \
            cmd/fileee-server/errors.go:90 \
            cmd/fileee-server/handlers_entities.go:90 \
            cmd/fileee-server/handlers_documents.go:80 \
            cmd/fileee-server/version.go:90 \
            cmd/fileee-server/banner.go:90 \
            cmd/fileee-server/selfcheck.go:90
      - name: Doc-Coverage (exportierte Symbole)
        run: |
          chmod +x scripts/doc-coverage.sh
          ./scripts/doc-coverage.sh
  # deploy/Dockerfile wurde bis dahin nur im Release gebaut — eine Regression darin fiel erst
  # im naechtlichen release.yml auf, nach dem Merge (siehe #24). Dieser Job baut dasselbe
  # Dockerfile ohne Push, damit sie vor dem Merge auffaellt. Damit Renovates automerge darauf
  # wartet, muss "docker-build" in den Required Status Checks der main-Branch-Protection stehen.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
